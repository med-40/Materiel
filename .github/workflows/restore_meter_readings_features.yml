name: Restore meter readings features

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore_meter_readings_features.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch meter readings behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          template = Path('app/modules/meter_readings/templates/meter_readings.html')
          text = template.read_text(encoding='utf-8')

          old = '''<button class="btn primary" type="button" onclick="openReadingModal()">＋ إضافة قراءة</button><button class="btn" type="button" onclick="openImportModal()">⇧ استيراد ملف Excel</button><button class="btn" type="button" onclick="openDateModal()">＋ إضافة تاريخ</button><button class="btn" type="button" onclick="openSelectedHistory()">▣ عرض السجل الزمني</button><button class="btn" type="button" onclick="location.reload()">↻</button>'''
          new = '''<button class="btn primary" type="button" onclick="openReadingModal()">＋ إضافة قراءة</button><button class="btn" type="button" onclick="openImportModal()">⇧ استيراد ملف Excel</button><button class="btn" type="button" onclick="openDateModal()">＋ إضافة تاريخ</button><button class="btn" type="button" onclick="location.reload()">↻</button>'''
          if old not in text:
              raise SystemExit('main actions target not found')
          text = text.replace(old, new, 1)

          old = '''<div class="table-card"><table id="readingsTable"><thead><tr><th>الرقم</th><th>الطراز</th><th>نوع العتاد</th><th>رقم التسجيل</th><th>وحدة العداد</th><th>آخر تاريخ قراءة</th><th>القراءة</th><th>الفارق</th><th>الملاحظة</th><th>حالة العداد</th><th>السجل</th></tr></thead><tbody>{% for row in readings %}<tr data-equipment-id="{{ row.equipment_id }}" data-reading-date="{{ row.date }}" onclick="selectRow(this)"><td>{{ row.number }}</td><td><strong>{{ row.model }}</strong></td><td>{{ row.type_name }}</td><td><strong>{{ row.registration }}</strong></td><td>{{ row.unit }}</td><td>{{ row.date }}</td><td><strong>{{ row.reading }}</strong></td><td>{{ row.difference }}</td><td>{{ row.note }}</td><td><span class="status {{ row.status_class }}">{{ row.status }}</span></td><td><a href="/meter-readings/history/{{ row.equipment_id }}" onclick="event.stopPropagation()">عرض</a></td></tr>{% else %}<tr><td colspan="11">لا توجد بيانات.</td></tr>{% endfor %}</tbody></table>'''
          new = '''<div class="table-card"><table id="readingsTable"><thead><tr><th>الرقم</th><th>الطراز</th><th>نوع العتاد</th><th>رقم التسجيل</th><th>وحدة العداد</th><th>آخر تاريخ قراءة</th><th>القراءة</th><th>الفارق</th><th>الملاحظة</th><th>حالة العداد</th></tr></thead><tbody>{% for row in readings %}<tr class="{% if row.status_class == 'danger' %}meter-row-danger{% endif %}" data-equipment-id="{{ row.equipment_id }}" data-reading-date="{{ row.date }}" onclick="openEquipmentHistory(this)"><td>{{ row.number }}</td><td><strong>{{ row.model }}</strong></td><td>{{ row.type_name }}</td><td><strong>{{ row.registration }}</strong></td><td>{{ row.unit }}</td><td>{{ row.date }}</td><td><strong>{{ row.reading }}</strong></td><td>{{ row.difference }}</td><td>{{ row.note }}</td><td><span class="status {{ row.status_class }}">{{ row.status }}</span></td></tr>{% else %}<tr><td colspan="10">لا توجد بيانات.</td></tr>{% endfor %}</tbody></table>'''
          if old not in text:
              raise SystemExit('table target not found')
          text = text.replace(old, new, 1)

          old = '''.table-card{background:#fff;border:1px solid #d8e0e8;border-radius:8px;overflow:auto}.table-card table{border-collapse:collapse;width:100%;min-width:1000px;font-size:12px}.table-card th,.table-card td{padding:9px;border-bottom:1px solid #e2e8f0;text-align:center;white-space:nowrap}.table-card th{background:#173b63;color:#fff}.table-card tbody tr:hover{background:#f5f9fd}.table-card tbody tr.selected{background:#eaf3ff}'''
          new = '''.table-card{background:#fff;border:1px solid #d8e0e8;border-radius:8px;overflow-x:auto;overflow-y:visible;max-width:100%;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}.table-card table{border-collapse:collapse;width:100%;min-width:1000px;font-size:12px}.table-card th,.table-card td{padding:9px;border-bottom:1px solid #e2e8f0;text-align:center;white-space:nowrap}.table-card th{background:#173b63;color:#fff}.table-card tbody tr{cursor:pointer}.table-card tbody tr:hover{background:#f5f9fd}.table-card tbody tr.meter-row-danger{background:#fff1f2;color:#991b1b}.table-card tbody tr.meter-row-danger:hover{background:#ffe4e6}.table-card tbody tr.meter-row-danger td strong{color:#991b1b}'''
          if old not in text:
              raise SystemExit('table css target not found')
          text = text.replace(old, new, 1)

          old = '''function selectRow(row){document.querySelectorAll('tbody tr.selected').forEach(x=>x.classList.remove('selected'));row.classList.add('selected');selectedEquipmentId=row.dataset.equipmentId}\nfunction openSelectedHistory(){if(selectedEquipmentId)location.href='/meter-readings/history/'+selectedEquipmentId;else alert('اختر عتادًا أولاً.')}'''
          new = '''function openEquipmentHistory(row){const id=row&&row.dataset.equipmentId;if(id)location.href='/meter-readings/history/'+id}'''
          if old not in text:
              raise SystemExit('selection functions target not found')
          text = text.replace(old, new, 1)

          template.write_text(text, encoding='utf-8')

          services = Path('app/modules/meter_readings/services.py')
          text = services.read_text(encoding='utf-8')

          old = '''unit_code = _unit(equipment); latest = history[equipment.id][0] if history[equipment.id] else None; previous = history[equipment.id][1] if len(history[equipment.id]) > 1 else None; difference = _difference(latest, previous, unit_code) if latest else None; equipment_status, status_class = _equipment_status_label(equipment)'''
          new = '''unit_code = _unit(equipment); latest = history[equipment.id][0] if history[equipment.id] else None; previous = history[equipment.id][1] if len(history[equipment.id]) > 1 else None; difference = _difference(latest, previous, unit_code) if latest else None; equipment_status, status_class = _equipment_status_label(equipment); latest_status = str(getattr(latest, "equipment_status", "") or equipment.operational_status or "available").strip().lower(); equipment_status, status_class = ("لا يعمل", "danger") if latest_status in {"unavailable", "not_working", "not-working", "stopped", "out_of_service", "out-of-service"} else ("يعمل", "success")'''
          if old not in text:
              raise SystemExit('latest status target not found')
          text = text.replace(old, new, 1)

          old = '''ordered = db.query(MeterReading.id.label("id"), MeterReading.reading_date.label("reading_date"), MeterReading.odometer.label("odometer"), MeterReading.hours.label("hours"), MeterReading.notes.label("notes"), func.lag(MeterReading.odometer).over(partition_by=MeterReading.equipment_id, order_by=(MeterReading.reading_date.desc(), MeterReading.id.desc())).label("previous_odometer"), func.lag(MeterReading.hours).over(partition_by=MeterReading.equipment_id, order_by=(MeterReading.reading_date.desc(), MeterReading.id.desc())).label("previous_hours")).filter(MeterReading.equipment_id == equipment_id).subquery()'''
          new = '''ordered = db.query(MeterReading.id.label("id"), MeterReading.reading_date.label("reading_date"), MeterReading.odometer.label("odometer"), MeterReading.hours.label("hours"), MeterReading.equipment_status.label("equipment_status"), MeterReading.notes.label("notes"), func.lag(MeterReading.odometer).over(partition_by=MeterReading.equipment_id, order_by=(MeterReading.reading_date.desc(), MeterReading.id.desc())).label("previous_odometer"), func.lag(MeterReading.hours).over(partition_by=MeterReading.equipment_id, order_by=(MeterReading.reading_date.desc(), MeterReading.id.desc())).label("previous_hours")).filter(MeterReading.equipment_id == equipment_id).subquery()'''
          if old not in text:
              raise SystemExit('history query target not found')
          text = text.replace(old, new, 1)

          old = '''total = db.query(func.count()).select_from(ordered).scalar() or 0; pages = max(1, (total + page_size - 1) // page_size); page = min(page, pages); rows_data = db.query(ordered).order_by(ordered.c.reading_date.desc(), ordered.c.id.desc()).offset((page - 1) * page_size).limit(page_size).all(); equipment_status, status_class = _equipment_status_label(equipment); rows = []'''
          new = '''total = db.query(func.count()).select_from(ordered).scalar() or 0; pages = max(1, (total + page_size - 1) // page_size); page = min(page, pages); rows_data = db.query(ordered).order_by(ordered.c.reading_date.desc(), ordered.c.id.desc()).offset((page - 1) * page_size).limit(page_size).all(); rows = []'''
          if old not in text:
              raise SystemExit('history status setup target not found')
          text = text.replace(old, new, 1)

          old = '''current_value = row.odometer if unit_code == "km" else row.hours; previous_value = row.previous_odometer if unit_code == "km" else row.previous_hours; difference = Decimal(current_value) - Decimal(previous_value) if current_value is not None and previous_value is not None else None\n        rows.append({"number": number, "id": row.id, "date": row.reading_date.strftime("%d/%m/%Y"), "odometer": _fmt(row.odometer), "hours": _fmt(row.hours), "reading": _fmt(current_value), "difference": _fmt_difference(difference), "note": row.notes or "—", "status": equipment_status, "status_class": status_class, "unit": "كم" if unit_code == "km" else "ساعة عمل"})'''
          new = '''current_value = row.odometer if unit_code == "km" else row.hours; previous_value = row.previous_odometer if unit_code == "km" else row.previous_hours; difference = Decimal(current_value) - Decimal(previous_value) if current_value is not None and previous_value is not None else None; reading_status = str(row.equipment_status or "available").strip().lower(); reading_status, reading_status_class = ("لا يعمل", "danger") if reading_status in {"unavailable", "not_working", "not-working", "stopped", "out_of_service", "out-of-service"} else ("يعمل", "success")\n        rows.append({"number": number, "id": row.id, "date": row.reading_date.strftime("%d/%m/%Y"), "odometer": _fmt(row.odometer), "hours": _fmt(row.hours), "reading": _fmt(current_value), "difference": _fmt_difference(difference), "note": row.notes or "—", "status": reading_status, "status_class": reading_status_class, "unit": "كم" if unit_code == "km" else "ساعة عمل"})'''
          if old not in text:
              raise SystemExit('history row target not found')
          text = text.replace(old, new, 1)

          services.write_text(text, encoding='utf-8')

          history_template = Path('app/modules/meter_readings/templates/meter_readings_list.html')
          text = history_template.read_text(encoding='utf-8')
          old = '''{% for row in rows %}\n                    <tr>'''
          new = '''{% for row in rows %}\n                    <tr class="{% if row.status_class == 'danger' %}history-row-danger{% endif %}">'''
          if old not in text:
              raise SystemExit('history row html target not found')
          text = text.replace(old, new, 1)
          old = '''.history-table th,.history-table td{padding:10px 12px;text-align:center;border-left:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0;white-space:nowrap;font-size:12px}.history-table th{position:sticky;top:0;background:#173b63;color:#fff;z-index:5}'''
          new = '''.history-table th,.history-table td{padding:10px 12px;text-align:center;border-left:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0;white-space:nowrap;font-size:12px}.history-table th{position:sticky;top:0;background:#173b63;color:#fff;z-index:5}.history-table tbody tr.history-row-danger{background:#fff1f2;color:#991b1b}.history-table tbody tr.history-row-danger .reading{color:#991b1b}'''
          if old not in text:
              raise SystemExit('history css target not found')
          text = text.replace(old, new, 1)
          history_template.write_text(text, encoding='utf-8')
          PY

      - name: Validate Python syntax and tests
        run: |
          python -m compileall -q app
          python -m pytest -q

      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/restore_meter_readings_features.yml
          git add app/modules/meter_readings/templates/meter_readings.html app/modules/meter_readings/templates/meter_readings_list.html app/modules/meter_readings/services.py
          git commit -m "Restore meter readings navigation scrolling and status highlighting"
          git push
