name: one-time meter UI fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply the two requested UI fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/modules/meter_readings/templates/meter_readings.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('<th>الرقم</th><th class="sticky-model">الطراز</th>', '<th class="sticky-number">الرقم</th><th class="sticky-model">الطراز</th>'),
              ('<td>{{ row.number }}</td><td class="sticky-model strong">', '<td class="sticky-number">{{ row.number }}</td><td class="sticky-model strong">'),
              ('.sticky-model,.sticky-registration{position:sticky;', '.sticky-number,.sticky-model,.sticky-registration{position:sticky;'),
              ('.meter-table thead .sticky-model,.meter-table thead .sticky-registration{background:', '.meter-table thead .sticky-number,.meter-table thead .sticky-model,.meter-table thead .sticky-registration{background:'),
              ('.sticky-registration{right:0;min-width:155px;width:155px}.sticky-model{right:155px;min-width:190px;width:190px}', '.sticky-number{right:0;min-width:60px;width:60px}.sticky-model{right:60px;min-width:190px;width:190px}.sticky-registration{right:250px;min-width:155px;width:155px}'),
              ('.paste-area{width:100%;min-height:120px;', '.paste-area{width:100%;min-height:220px;'),
              ('.sticky-registration{min-width:135px;width:135px}.sticky-model{right:135px;min-width:165px;width:165px}', '.sticky-number{min-width:50px;width:50px}.sticky-model{right:50px;min-width:165px;width:165px}.sticky-registration{right:215px;min-width:135px;width:135px}'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected pattern not found: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove this one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/modules/meter_readings/templates/meter_readings.html
          git commit -m 'fix meter paste area and table spacing'
          git rm .github/workflows/one-time-meter-ui-fix.yml
          git commit -m 'remove one-time meter UI fix workflow'
          git push origin main
