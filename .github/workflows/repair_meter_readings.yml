name: Repair meter readings

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch meter reading validation and paste UI
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          service = Path('app/modules/meter_readings/services.py')
          s = service.read_text(encoding='utf-8')

          marker = '\ndef list_latest_rows('
          cleanup = r'''

def cleanup_invalid_readings(db: Session):
    """Remove legacy readings that violate the non-negotiable date/value rules.

    Future readings were never valid and are removed automatically when the
    meter-readings module is opened. Negative values are also legacy-invalid.
    The operation is idempotent and refreshes the current meter value.
    """
    today = datetime.utcnow().date()
    invalid = (
        db.query(MeterReading)
        .filter(MeterReading.reading_date > datetime.combine(today, datetime.max.time()))
        .all()
    )
    invalid += db.query(MeterReading).filter(
        (MeterReading.odometer < 0) | (MeterReading.hours < 0)
    ).all()
    unique = {item.id: item for item in invalid}
    if not unique:
        return 0
    equipment_ids = {item.equipment_id for item in unique.values()}
    for item in unique.values():
        db.delete(item)
    db.flush()
    for equipment_id in equipment_ids:
        equipment = get_equipment_with_readings(db, equipment_id)
        if equipment:
            _refresh_equipment_current(db, equipment, _unit(equipment))
    db.commit()
    return len(unique)
'''
          if 'def cleanup_invalid_readings' not in s:
              s = s.replace(marker, cleanup + marker, 1)

          # Add equipment type to paste-row normalization.
          old = '"registration": row.get("registration"),\n                "reading_date": _parse_date(row.get("reading_date")),'
          new = '"equipment_type": row.get("equipment_type"),\n                "registration": row.get("registration"),\n                "reading_date": _parse_date(row.get("reading_date")),'
          # This replacement belongs to router.py, not services.py; kept here only as a guard.

          service.write_text(s, encoding='utf-8')

          router = Path('app/modules/meter_readings/router.py')
          r = router.read_text(encoding='utf-8')

          # Clean legacy invalid rows before every meter-reading page render.
          target = 'def meter_readings_page(request: Request, page: int = Query(1, ge=1),'
          if 'services.cleanup_invalid_readings(db)' not in r:
              pos = r.index(target)
              body_pos = r.index('):', pos) + 2
              insert_after = '\n    services.cleanup_invalid_readings(db)'
              r = r[:body_pos] + insert_after + r[body_pos:]

          old = '"registration": row.get("registration"),\n                "reading_date": _parse_date(row.get("reading_date")),'
          new = '"equipment_type": row.get("equipment_type"),\n                "registration": row.get("registration"),\n                "reading_date": _parse_date(row.get("reading_date")),'
          if old not in r:
              raise SystemExit('Could not find paste-row parser marker')
          r = r.replace(old, new, 1)
          router.write_text(r, encoding='utf-8')

          # Validate the pasted equipment type against the registration.
          service = Path('app/modules/meter_readings/services.py')
          s = service.read_text(encoding='utf-8')
          needle = '        equipment = equipment_map.get(registration)\n        if not equipment:\n            errors.append(f"الصف {row_number}: رقم التسجيل {registration_raw} غير موجود في النظام.")\n            continue\n'
          replacement = needle + '''        equipment_type_raw = row.get("equipment_type")
        if equipment_type_raw is None or not str(equipment_type_raw).strip():
            errors.append(f"الصف {row_number}: نوع العتاد فارغ.")
            continue
        expected_type = str(equipment.equipment_type.name if equipment.equipment_type else "").strip()
        pasted_type = " ".join(str(equipment_type_raw).strip().split()).casefold()
        if expected_type and pasted_type != " ".join(expected_type.split()).casefold():
            errors.append(
                f"الصف {row_number}: نوع العتاد «{equipment_type_raw}» لا يطابق نوع العتاد المسجل «{expected_type}» لرقم التسجيل {registration_raw}."
            )
            continue
'''
          if needle not in s:
              raise SystemExit('Could not find equipment validation marker')
          s = s.replace(needle, replacement, 1)
          service.write_text(s, encoding='utf-8')

          # Update the paste modal labels/order and replace the paste submitter.
          template = Path('app/modules/meter_readings/templates/meter_readings.html')
          t = template.read_text(encoding='utf-8')
          t = t.replace(
              'رقم التسجيل | التاريخ | الكيلومترات | الساعات | الملاحظات | حالة العداد',
              'نوع العتاد | رقم التسجيل | التاريخ | الكيلومترات | الساعات | الملاحظات | حالة العداد',
              1,
          )
          t = t.replace(
              '123-001&#9;15/08/2026&#9;12500&#9;&#9;عادي\\n123-002&#9;15/08/2026&#9;&#9;8750&#9;صيانة',
              'شاحنة&#9;123-001&#9;15/08/2026&#9;12500&#9;&#9;عادي&#9;يعمل\\nسيارة&#9;123-002&#9;15/08/2026&#9;&#9;8750&#9;صيانة&#9;يعمل',
              1,
          )

          def replace_function(text, name, replacement):
              start = text.find(f'function {name}')
              if start < 0:
                  raise SystemExit(f'Function not found: {name}')
              brace = text.find('{', start)
              if brace < 0:
                  raise SystemExit(f'Function body not found: {name}')
              depth = 0
              quote = None
              escape = False
              for i in range(brace, len(text)):
                  ch = text[i]
                  if quote:
                      if escape:
                          escape = False
                      elif ch == '\\\\':
                          escape = True
                      elif ch == quote:
                          quote = None
                      continue
                  if ch in "'\"`":
                      quote = ch
                      continue
                  if ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return text[:start] + replacement + text[i+1:]
              raise SystemExit(f'Unbalanced function: {name}')

          new_submit = r'''async function submitPastedReadings(){
              const box = document.getElementById('pasteData');
              const result = document.getElementById('pasteResult');
              const raw = (box && box.value || '').trim();
              result.innerHTML = '';
              if (!raw) {
                  result.innerHTML = '<div class="error-card">⚠️ ألصق بيانات Excel أولاً.</div>';
                  return;
              }
              const lines = raw.split(/\\r?\\n/).filter(line => line.trim());
              const rows = [];
              for (let i = 0; i < lines.length; i++) {
                  const parts = lines[i].split('\\t');
                  if (parts.length < 7) {
                      result.innerHTML += `<div class="error-card">⚠️ الصف ${i + 1}: يجب أن يحتوي على 7 أعمدة: نوع العتاد، رقم التسجيل، التاريخ، الكيلومترات، الساعات، الملاحظات، حالة العداد.</div>`;
                      continue;
                  }
                  rows.push({
                      equipment_type: parts[0].trim(),
                      registration: parts[1].trim(),
                      reading_date: parts[2].trim(),
                      km_value: parts[3].trim(),
                      hours_value: parts[4].trim(),
                      notes: parts[5].trim(),
                      equipment_status: parts[6].trim()
                  });
              }
              if (!rows.length) return;
              try {
                  const response = await fetch('/meter-readings/bulk-create', {
                      method: 'POST',
                      headers: {'Content-Type': 'application/json'},
                      body: JSON.stringify({rows})
                  });
                  const data = await response.json();
                  let html = `<div class="import-summary">تم قبول ${data.created || 0} صف، ورفض ${data.skipped || 0} صف.</div>`;
                  if (data.errors && data.errors.length) html += data.errors.join('');
                  result.innerHTML = html;
                  if ((data.created || 0) > 0 && !(data.errors && data.errors.length)) {
                      setTimeout(() => window.location.reload(), 500);
                  }
              } catch (error) {
                  result.innerHTML = `<div class="error-card">⚠️ تعذر الاتصال بالخادم: ${String(error)}</div>`;
              }
          }'''
          t = replace_function(t, 'submitPastedReadings', new_submit)
          template.write_text(t, encoding='utf-8')
          PY

      - name: Syntax check
        run: python -m compileall -q app web run_web.py

      - name: Remove repair workflow and commit changes
        run: |
          rm -f .github/workflows/repair_meter_readings.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/modules/meter_readings/services.py app/modules/meter_readings/router.py app/modules/meter_readings/templates/meter_readings.html .github/workflows/repair_meter_readings.yml
          git diff --cached --quiet || git commit -m 'fix meter reading cleanup and paste columns'
          git push
