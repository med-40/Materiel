name: Repair meter readings

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply repair script
        run: python scripts/repair_meter_readings.py
      - name: Syntax check
        run: python -m compileall -q app web run_web.py scripts/repair_meter_readings.py
      - name: Commit repaired files and remove helper
        run: |
          rm -f .github/workflows/repair_meter_readings.yml scripts/repair_meter_readings.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/modules/meter_readings/services.py app/modules/meter_readings/router.py app/modules/meter_readings/templates/meter_readings.html .github/workflows/repair_meter_readings.yml scripts/repair_meter_readings.py
          git diff --cached --quiet || git commit -m 'fix meter reading cleanup and paste columns'
          git push
