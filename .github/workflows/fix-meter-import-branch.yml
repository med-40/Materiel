name: Final meter import repair

on:
  push:
    branches: [fix/meter-import-final]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check openpyxl
      - name: Apply fixes and test
        run: |
          python - <<'PY'
          from pathlib import Path
          helper='''from __future__ import annotations
          from io import BytesIO
          from zipfile import ZipFile
          from xml.etree import ElementTree as ET
          from openpyxl import load_workbook
          NS="http://schemas.openxmlformats.org/spreadsheetml/2006/main"
          REL="http://schemas.openxmlformats.org/officeDocument/2006/relationships"
          def tag(n): return f"{{{NS}}}{n}"
          def col_index(ref):
              n=0
              for ch in "".join(c for c in ref if c.isalpha()).upper(): n=n*26+ord(ch)-64
              return max(0,n-1)
          class RawSheet:
              def __init__(self,rows): self.rows=rows
              def iter_rows(self,values_only=True): return iter(self.rows)
          class RawWorkbook:
              def __init__(self,rows): self.active=RawSheet(rows)
          def raw_xlsx(data):
              with ZipFile(BytesIO(data)) as z:
                  names=set(z.namelist()); shared=[]
                  if "xl/sharedStrings.xml" in names:
                      root=ET.fromstring(z.read("xl/sharedStrings.xml"))
                      for si in root.findall(tag("si")): shared.append("".join(t.text or "" for t in si.iter(tag("t"))))
                  sheet="xl/worksheets/sheet1.xml"
                  if "xl/workbook.xml" in names and "xl/_rels/workbook.xml.rels" in names:
                      wb=ET.fromstring(z.read("xl/workbook.xml")); rr=ET.fromstring(z.read("xl/_rels/workbook.xml.rels")); rels={r.attrib.get("Id"):r.attrib.get("Target") for r in rr}; sheets=wb.find(tag("sheets")); first=next(iter(sheets),None) if sheets is not None else None
                      if first is not None:
                          target=rels.get(first.attrib.get(f"{{{REL}}}id"))
                          if target: target=target.lstrip("/"); sheet=target if target.startswith("xl/") else "xl/"+target
                  root=ET.fromstring(z.read(sheet)); sd=root.find(tag("sheetData")); rows=[]
                  if sd is None: return RawWorkbook([])
                  for row in sd.findall(tag("row")):
                      cells={}; mx=-1
                      for c in row.findall(tag("c")):
                          idx=col_index(c.attrib.get("r","A1")); mx=max(mx,idx); typ=c.attrib.get("t"); v=c.find(tag("v")); raw=v.text if v is not None else None; value=None
                          if typ=="inlineStr":
                              el=c.find(tag("is")); value="".join(t.text or "" for t in el.iter(tag("t"))) if el is not None else ""
                          elif raw is not None and typ=="s":
                              try: value=shared[int(raw)]
                              except (ValueError,IndexError): value=raw
                          elif raw is not None and typ=="b": value=raw=="1"
                          elif raw is not None:
                              try: value=float(raw); value=int(value) if value.is_integer() else value
                              except (TypeError,ValueError): value=raw
                          cells[idx]=value
                      rows.append([cells.get(i) for i in range(mx+1)])
                  return RawWorkbook(rows)
          def load_meter_workbook(stream):
              data=stream.read()
              if hasattr(stream,"seek"): stream.seek(0)
              try: return load_workbook(BytesIO(data),read_only=True,data_only=True)
              except Exception as exc:
                  try: return raw_xlsx(data)
                  except Exception as raw_exc: raise ValueError(f"تعذر قراءة ملف Excel. تأكد أن الملف بصيغة XLSX سليمة. التفاصيل: {exc}") from raw_exc
          '''
          Path('app/modules/meter_readings/excel_reader.py').write_text(helper,encoding='utf-8')

          p=Path('app/modules/meter_readings/router.py'); t=p.read_text(encoding='utf-8')
          t=t.replace('from openpyxl import load_workbook\n','from app.modules.meter_readings.excel_reader import load_meter_workbook\n').replace('load_workbook(file.file, read_only=True, data_only=True)','load_meter_workbook(file.file)')
          t=t.replace('    equipment_status = payload.get("equipment_status", "available")\n','').replace('db, [{**row, "equipment_status": equipment_status} for row in valid_rows]','db, valid_rows').replace('"equipment_status": row.get("equipment_status", "available"),','"equipment_status": row.get("equipment_status"),')
          t=t.replace('equipment_status: str = Form("available")','equipment_status: str | None = Form(None)')
          t=t.replace('"القراءة": "legacy", "قيمهالعداد": "legacy", "قيمةالعداد": "legacy", "reading": "legacy", "value": "legacy", "meter": "legacy", "meterreading": "legacy",','"القراءة": "legacy", "قيمهالعداد": "legacy", "قيمةالعداد": "legacy", "reading": "legacy", "value": "legacy", "meter": "legacy", "meterreading": "legacy", "حالهالعداد": "status", "حالةالعداد": "status", "status": "status", "equipmentstatus": "status", "operationalstatus": "status",')
          t=t.replace('if "قراء" in text or "value" in text or "meter" in text: return "legacy"','if "حالهالعداد" in text or "حالةالعداد" in text or "status" in text or "operationalstatus" in text: return "status"\n            if "قراء" in text or "value" in text or "meter" in text: return "legacy"')
          t=t.replace('if "registration" in kinds and "date" in kinds and ("km" in kinds or "hours" in kinds or "legacy" in kinds):','if "registration" in kinds and "date" in kinds and ("km" in kinds or "hours" in kinds or "legacy" in kinds) and ("status" in kinds or equipment_status):')
          t=t.replace('notes_idx = columns.get("notes")\n        import_rows, parse_errors = [], []','notes_idx = columns.get("notes")\n        status_idx = columns.get("status")\n        import_rows, parse_errors = [], []')
          t=t.replace('notes = cell(values, notes_idx) or ""\n            try:','notes = cell(values, notes_idx) or ""\n            status_value = cell(values, status_idx) if status_idx is not None else equipment_status\n            try:')
          t=t.replace('if registration is None or str(registration).strip() == "":\n                    raise ValueError("رقم التسجيل فارغ.")','if registration is None or str(registration).strip() == "":\n                    raise ValueError("رقم التسجيل فارغ.")\n                if status_value is None or not str(status_value).strip():\n                    raise ValueError("حالة العداد فارغة؛ يجب أن تكون «يعمل» أو «لا يعمل».")')
          t=t.replace('"notes": notes, "equipment_status": equipment_status, "_row_number": row_number,','"notes": notes, "equipment_status": status_value, "_row_number": row_number,')
          marker='@router.get("/history/{equipment_id}", response_class=HTMLResponse)'
          alias='''@router.post("/import-excel-preview")\ndef meter_readings_import_excel_preview(file: UploadFile = File(...), equipment_status: str | None = Form(None), db: Session = Depends(get_db), current_user: User = Depends(get_current_user)):\n    return meter_readings_import_excel(file, equipment_status, db, current_user)\n\n\n'''
          if '@router.post("/import-excel-preview")' not in t: t=t.replace(marker,alias+marker)
          p.write_text(t,encoding='utf-8')

          p=Path('app/modules/meter_readings/services.py'); t=p.read_text(encoding='utf-8')
          helper='''\n\ndef parse_equipment_status(value) -> str:\n    text=str(value or "").strip().lower()\n    if text in {"يعمل","يشتغل","متاح","available","working","on"}: return "available"\n    if text in {"لا يعمل","لايعمل","غير متاح","غيرمتاح","unavailable","not_working","not-working","stopped","out_of_service","out-of-service","off"}: return "unavailable"\n    raise ValueError("حالة العداد غير صحيحة؛ يجب أن تكون «يعمل» أو «لا يعمل».")\n'''
          if 'def parse_equipment_status' not in t: t=t.replace('\ndef normalize_registration(value) -> str:',helper+'\n\ndef normalize_registration(value) -> str:')
          old='''        candidates.append({\n            "equipment": equipment, "reading_date": reading_date, "value": value,\n            "blank_value": blank_value,\n            "notes": str(row.get("notes") or "").strip()[:300] or None,\n            "equipment_status": normalize_equipment_status(row.get("equipment_status", "available")),\n            "_row_number": row_number,\n        })'''
          new='''        try:\n            equipment_status = parse_equipment_status(row.get("equipment_status"))\n        except ValueError as exc:\n            errors.append(f"الصف {row_number}: {exc}")\n            continue\n        candidates.append({\n            "equipment": equipment, "reading_date": reading_date, "value": value,\n            "blank_value": blank_value,\n            "notes": str(row.get("notes") or "").strip()[:300] or None,\n            "equipment_status": equipment_status,\n            "_row_number": row_number,\n        })'''
          if old not in t: raise SystemExit('bulk status block not found')
          p.write_text(t.replace(old,new),encoding='utf-8')

          p=Path('app/modules/meter_readings/templates/meter_readings.html'); t=p.read_text(encoding='utf-8')
          t=t.replace('<p>اختر حالة العتاد للقراءات التي سيتم لصقها.</p>','<p>حالة العداد تُحدد لكل عتاد داخل بيانات الإدخال.</p>')
          t=t.replace('<div class="form-field" style="margin-bottom:10px"><label>حالة العتاد</label><select id="pasteEquipmentStatus"><option value="available">يعمل</option><option value="unavailable">لا يعمل</option></select></div>','')
          t=t.replace('رقم التسجيل | التاريخ | الكيلومترات | الساعات | الملاحظات','رقم التسجيل | التاريخ | الكيلومترات | الساعات | الملاحظات | حالة العداد')
          t=t.replace('<span>سيتم مطابقة رقم التسجيل ثم أخذ القيمة من العمود الموافق لنوع عداد العتاد.</span>','<span>سيتم مطابقة رقم التسجيل وأخذ القراءة من العمود الموافق لنوع العداد. يجب أن يحتوي كل صف على حالة العداد: يعمل أو لا يعمل.</span>')
          t=t.replace('<div class="form-field" style="margin-bottom:10px"><label>حالة العتاد للملف</label><select id="excelEquipmentStatus"><option value="available">يعمل</option><option value="unavailable">لا يعمل</option></select></div>','')
          t=t.replace('const status=document.getElementById(\'pasteEquipmentStatus\').value;','')
          t=t.replace("const payload=rows.map(c=>({registration:c[0]||'',reading_date:parseDateClient(c[1]||''),km_value:c[2]||null,hours_value:c[3]||null,notes:c.slice(4).join(' ')||'',equipment_status:status}));","const payload=rows.map(c=>({registration:c[0]||'',reading_date:parseDateClient(c[1]||''),km_value:c[2]||null,hours_value:c[3]||null,notes:c[4]||'',equipment_status:c[5]||null}));")
          t=t.replace("f.append('equipment_status',document.getElementById('excelEquipmentStatus').value);",'')
          p.write_text(t,encoding='utf-8')
          PY
          PYTHONPATH=. python -m compileall -q app
          PYTHONPATH=. python - <<'PY'
          from io import BytesIO
          from zipfile import ZipFile,ZIP_DEFLATED
          from openpyxl import Workbook
          from app.modules.meter_readings.excel_reader import load_meter_workbook
          wb=Workbook(); ws=wb.active
          ws.append(["حالة العداد","الكيلومترات","رقم التسجيل","الملاحظات","التاريخ"]); ws.append(["لا يعمل",500,"356","سليم","11/08/2026"])
          b=BytesIO(); wb.save(b); b.seek(0)
          with ZipFile(b,'r') as zin:
              out=BytesIO()
              with ZipFile(out,'w',ZIP_DEFLATED) as zout:
                  for item in zin.infolist():
                      if item.filename!='xl/styles.xml': zout.writestr(item,zin.read(item.filename))
          out.seek(0); rows=list(load_meter_workbook(out).active.iter_rows(values_only=True)); assert rows[1][0]=='لا يعمل' and rows[1][1]==500 and rows[1][2]=='356'
          print('PASS: XLSX Arabic/reordered headers + broken stylesheet fallback')
          PY
          ! grep -q 'id="excelEquipmentStatus"' app/modules/meter_readings/templates/meter_readings.html
          ! grep -q 'id="pasteEquipmentStatus"' app/modules/meter_readings/templates/meter_readings.html
          grep -q 'equipment_status:c\[5\]' app/modules/meter_readings/templates/meter_readings.html
      - name: Commit repair to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git rm .github/workflows/fix-meter-import-branch.yml
          git add app/modules/meter_readings/excel_reader.py app/modules/meter_readings/router.py app/modules/meter_readings/services.py app/modules/meter_readings/templates/meter_readings.html
          git commit -m "fix: Excel import status per equipment and 404 compatibility"
          git push origin HEAD:fix/meter-import-final
