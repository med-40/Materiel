name: Fix paste JavaScript
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/fix_paste_js.py
      - run: python -m compileall -q app web run_web.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/modules/meter_readings/templates/meter_readings.html scripts/fix_paste_js.py .github/workflows/fix_paste_js.yml
          git rm -f scripts/fix_paste_js.py .github/workflows/fix_paste_js.yml
          git commit -m "fix: paste Excel parsing"
          git push
