name: Fix meter Excel header mapping

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix Arabic meter-column aliases
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/modules/meter_readings/router.py')
          s = p.read_text(encoding='utf-8')
          old = '"الكيلومترات": "km", "كيلومترات": "km", "الكلم": "km", "كلم": "km", "عدادالكلم": "km", "عدادالكيلومترات": "km", "كم": "km",'
          new = '"الكيلومترات": "km", "كيلومترات": "km", "الكيلومتر": "km", "كيلومتر": "km", "الكم": "km", "الكلم": "km", "كلم": "km", "عدادالكلم": "km", "عدادالكيلومترات": "km", "عدادالكيلومتر": "km", "عدادالكم": "km", "كم": "km",'
          if old not in s:
              raise SystemExit('لم يتم العثور على موضع إصلاح أعمدة الكيلومترات.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Add regression test for screenshot-style Arabic headers
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_meter_readings.py')
          s = p.read_text(encoding='utf-8')
          marker = '\ndef test_excel_screenshot_style_headers_are_detected(db):\n'
          if marker not in s:
              s += '''\n\ndef test_excel_screenshot_style_headers_are_detected(db):\n    equipment = seed_equipment(db, "688", "km")\n    wb = Workbook()\n    ws = wb.active\n    ws.append(["رقم التسجيل", "التاريخ", "عداد الكم", "عداد الساعات", "الملاحظات"])\n    ws.append(["688", "16/08/2026", 900, None, "سليم"])\n    buffer = BytesIO()\n    wb.save(buffer)\n    buffer.seek(0)\n    upload = UploadFile(filename="headers.xlsx", file=buffer)\n    user = User(username="headers-tester", full_name="اختبار العناوين", hashed_password="x", role="admin")\n    db.add(user)\n    db.commit()\n    db.refresh(user)\n    response = meter_readings_import_excel(upload, "available", db, user)\n    assert response.status_code == 200\n    assert b'"created":1' in response.body\n    assert db.query(MeterReading).filter(MeterReading.equipment_id == equipment.id).count() == 1\n    reading = db.query(MeterReading).filter(MeterReading.equipment_id == equipment.id).one()\n    assert float(reading.odometer) == 900.0\n'''
              p.write_text(s, encoding='utf-8')
          PY

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt pytest

      - name: Run meter-reading tests
        run: |
          python -m pytest tests/test_meter_readings.py -q

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/modules/meter_readings/router.py tests/test_meter_readings.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: detect Arabic meter column headers in Excel import"
          git push
