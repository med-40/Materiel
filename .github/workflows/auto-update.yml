name: Automatic Project Update Log

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    # منع تشغيل الـWorkflow مرة أخرى بسبب الـcommit الذي ينشئه بنفسه
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update README
        run: |
          DATE="$(date '+%Y-%m-%d %H:%M:%S %Z')"
          COMMIT="${GITHUB_SHA:0:7}"

          {
            echo "## تحديث تلقائي - $DATE"
            echo
            echo "- Commit: \`$COMMIT\`"
            echo "- Branch: \`main\`"
            echo "- منفذ التحديث: GitHub Actions"
            echo
            echo "---"
            echo
            cat README.md
          } > README.tmp

          mv README.tmp README.md

      - name: Commit and push README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "لا توجد تغييرات في README."
            exit 0
          fi

          git commit -m "docs: تحديث سجل المشروع تلقائيا"
          git push
