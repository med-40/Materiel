name: Add audit navigation buttons
on:
  push:
    branches: [fix/audit-navigation-buttons]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add navigation buttons
        run: |
          python - <<'PY'
          from pathlib import Path
          base=Path('web/templates/base.html')
          text=base.read_text(encoding='utf-8')
          marker='<a href="/meter-readings" class="{% if request.url.path.startswith(\'/meter-readings\') %}active{% endif %}"><span class="menu-icon">◷</span><span>قراءات العداد</span></a>'
          link='<a href="/meter-readings/operations" class="{% if request.url.path.startswith(\'/meter-readings/operations\') %}active{% endif %}"><span class="menu-icon">▤</span><span>سجل عمليات الإدخال</span></a>'
          if '/meter-readings/operations' not in text:
              if marker not in text: raise SystemExit('meter menu marker not found')
              text=text.replace(marker, marker+'\n            '+link, 1)
              base.write_text(text,encoding='utf-8')

          meter=Path('app/modules/meter_readings/templates/meter_readings.html')
          text=meter.read_text(encoding='utf-8')
          old='<button type="button" class="btn-light" onclick="openSelectedHistory()">▣ عرض السجل الزمني</button>'
          new=old+'<a class="btn-light" href="/meter-readings/operations" style="text-decoration:none;display:inline-flex;align-items:center;">▤ سجل الأحداث والعمليات</a>'
          if 'href="/meter-readings/operations"' not in text:
              if old not in text: raise SystemExit('meter action marker not found')
              text=text.replace(old,new,1)
              meter.write_text(text,encoding='utf-8')
          PY
      - name: Verify routes and navigation
        run: |
          python -m compileall -q app web
          grep -q 'href="/meter-readings/operations"' web/templates/base.html
          grep -q 'href="/meter-readings/operations"' app/modules/meter_readings/templates/meter_readings.html
          grep -q 'def operations' app/modules/meter_readings/audit_router.py
          grep -q 'def operation_details' app/modules/meter_readings/audit_router.py
          grep -q 'def rollback' app/modules/meter_readings/audit_router.py
          grep -q 'include_router(meter_reading_audit_router' web/main.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-audit-navigation.yml
          git add web/templates/base.html app/modules/meter_readings/templates/meter_readings.html
          git commit -m "feat: add navigation to meter operation log"
          git push origin HEAD:fix/audit-navigation-buttons
