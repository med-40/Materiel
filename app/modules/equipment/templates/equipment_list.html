{% extends "base.html" %}
{% block title %}العتاد والسيارات{% endblock %}

{% block content %}
<div class="page-header">
    <h2>العتاد والسيارات</h2>
    <button type="button" class="btn-primary" onclick="toggleAddForm()">+ إضافة عتاد</button>
</div>

<div class="card" id="add-form-card" style="display:none;">
    <h3>إضافة عتاد جديد</h3>
    <form method="post" action="/equipment/create" class="grid-form">
        <div class="field">
            <label>الرقم الداخلي *</label>
            <input type="text" name="asset_code" required>
        </div>
        <div class="field">
            <label>الوثيقة</label>
            <input type="text" name="acquisition_document">
        </div>
        <div class="field">
            <label>نوع العتاد *</label>
            <select name="equipment_type_id" id="type-select" required onchange="onTypeChange()">
                <option value="">اختر النوع...</option>
                {% for t in types %}
                <option value="{{ t.id }}" data-hour-meter="{{ 'true' if t.has_hour_meter else 'false' }}">{{ t.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="field">
            <label>الطراز</label>
            <select name="equipment_model_id" id="model-select">
                <option value="">اختر النوع أولاً</option>
            </select>
        </div>
        <div class="field">
            <label>رقم التسجيل</label>
            <input type="text" name="registration_number">
        </div>
        <div class="field">
            <label>رقم الهيكل</label>
            <input type="text" name="vin">
        </div>
        <div class="field">
            <label>عداد الكم</label>
            <input type="number" step="0.1" name="current_odometer" value="0">
        </div>
        <div class="field" id="hour-meter-field" style="display:none;">
            <label>عداد الساعات</label>
            <input type="number" step="0.1" name="current_hours" value="0">
        </div>
        <div class="field">
            <label>الحالة الفنية</label>
            <select name="technical_condition">
                <option value="ready">جاهز</option>
                <option value="broken">عاطل</option>
            </select>
        </div>
        <div class="field">
            <label>الوضعية</label>
            <select name="operational_status">
                <option value="available">متاح
