name: Repair meter import

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Excel dependency for regression test
        run: python -m pip install --disable-pip-version-check openpyxl

      - name: Apply repair
        run: |
          python - <<'PY'
          from pathlib import Path
          helper = r'''from __future__ import annotations

          from io import BytesIO
          from zipfile import ZipFile
          from xml.etree import ElementTree as ET
          from openpyxl import load_workbook

          _NS_MAIN = "http://schemas.openxmlformats.org/spreadsheetml/2006/main"
          _NS_REL = "http://schemas.openxmlformats.org/officeDocument/2006/relationships"

          class _RawSheet:
              def __init__(self, rows): self._rows = rows
              def iter_rows(self, values_only=True): return iter(self._rows)

          class _RawWorkbook:
              def __init__(self, rows): self.active = _RawSheet(rows)

          def _tag(name): return f"{{{_NS_MAIN}}}{name}"

          def _col_index(ref):
              letters = "".join(ch for ch in ref if ch.isalpha())
              n = 0
              for ch in letters.upper(): n = n * 26 + ord(ch) - 64
              return max(0, n - 1)

          def _raw_xlsx(data: bytes):
              with ZipFile(BytesIO(data)) as zf:
                  names = set(zf.namelist())
                  shared = []
                  if "xl/sharedStrings.xml" in names:
                      root = ET.fromstring(zf.read("xl/sharedStrings.xml"))
                      for si in root.findall(_tag("si")):
                          shared.append("".join(t.text or "" for t in si.iter(_tag("t"))))
                  sheet_path = "xl/worksheets/sheet1.xml"
                  if "xl/workbook.xml" in names and "xl/_rels/workbook.xml.rels" in names:
                      wb_root = ET.fromstring(zf.read("xl/workbook.xml"))
                      rel_root = ET.fromstring(zf.read("xl/_rels/workbook.xml.rels"))
                      rels = {r.attrib.get("Id"): r.attrib.get("Target") for r in rel_root}
                      sheets = wb_root.find(_tag("sheets"))
                      first = next(iter(sheets), None) if sheets is not None else None
                      if first is not None:
                          rid = first.attrib.get(f"{{{_NS_REL}}}id")
                          target = rels.get(rid)
                          if target:
                              target = target.lstrip("/")
                              if not target.startswith("xl/"): target = "xl/" + target
                              sheet_path = target
                  if sheet_path not in names: raise ValueError("ملف Excel لا يحتوي على ورقة عمل قابلة للقراءة.")
                  root = ET.fromstring(zf.read(sheet_path))
                  rows = []
                  sheet_data = root.find(_tag("sheetData"))
                  if sheet_data is None: return _RawWorkbook([])
                  for row_el in sheet_data.findall(_tag("row")):
                      cells, max_col = {}, -1
                      for cell in row_el.findall(_tag("c")):
                          col = _col_index(cell.attrib.get("r", "A1")); max_col = max(max_col, col)
                          ctype = cell.attrib.get("t"); value = None
                          if ctype == "inlineStr":
                              is_el = cell.find(_tag("is")); value = "".join(t.text or "" for t in is_el.iter(_tag("t"))) if is_el is not None else ""
                          else:
                              v = cell.find(_tag("v")); raw = v.text if v is not None else None
                              if raw is None: value = None
                              elif ctype == "s":
                                  try: value = shared[int(raw)]
                                  except (ValueError, IndexError): value = raw
                              elif ctype == "b": value = raw == "1"
                              else:
                                  try:
                                      value = float(raw); value = int(value) if value.is_integer() else value
                                  except (TypeError, ValueError): value = raw
                          cells[col] = value
                      rows.append([cells.get(i) for i in range(max_col + 1)])
                  return _RawWorkbook(rows)

          def load_meter_workbook(stream):
              data = stream.read()
              if hasattr(stream, "seek"): stream.seek(0)
              try: return load_workbook(BytesIO(data), read_only=True, data_only=True)
              except Exception as exc:
                  try: return _raw_xlsx(data)
                  except Exception as raw_exc:
                      raise ValueError(f"تعذر قراءة ملف Excel. تأكد أن الملف بصيغة XLSX سليمة. التفاصيل: {exc}") from raw_exc
          '''
          Path('app/modules/meter_readings/excel_reader.py').write_text(helper, encoding='utf-8')

          router = Path('app/modules/meter_readings/router.py'); text = router.read_text(encoding='utf-8')
          text = text.replace('from openpyxl import load_workbook\n', 'from app.modules.meter_readings.excel_reader import load_meter_workbook\n')
          text = text.replace('load_workbook(file.file, read_only=True, data_only=True)', 'load_meter_workbook(file.file)')
          text = text.replace('    equipment_status = payload.get("equipment_status", "available")\n', '')
          text = text.replace('services.create_bulk_readings(\n            db, [{**row, "equipment_status": equipment_status} for row in valid_rows]\n        )', 'services.create_bulk_readings(db, valid_rows)')
          text = text.replace('            "equipment_status": row.get("equipment_status", "available"),', '            "equipment_status": row.get("equipment_status"),')
          text = text.replace('def meter_readings_import_excel(file: UploadFile = File(...), equipment_status: str = Form("available"), db: Session = Depends(get_db), current_user: User = Depends(get_current_user)):', 'def meter_readings_import_excel(file: UploadFile = File(...), db: Session = Depends(get_db), current_user: User = Depends(get_current_user)):')
          text = text.replace('                    "notes": notes, "equipment_status": equipment_status, "_row_number": row_number,', '                    "notes": notes, "equipment_status": status_value, "_row_number": row_number,')
          text = text.replace('        notes_idx = columns.get("notes")\n', '        notes_idx = columns.get("notes")\n        status_idx = columns.get("status")\n')
          text = text.replace('            notes = cell(values, notes_idx) or ""\n', '            notes = cell(values, notes_idx) or ""\n            status_value = cell(values, status_idx)\n')
          text = text.replace('                "reading": "legacy", "value": "legacy", "meter": "legacy", "meterreading": "legacy",', '                "reading": "legacy", "value": "legacy", "meter": "legacy", "meterreading": "legacy",\n                "حالهالعداد": "status", "حالةالعداد": "status", "حالالعداد": "status", "status": "status", "equipmentstatus": "status", "operationalstatus": "status",')
          text = text.replace('            if "قراء" in text or "value" in text or "meter" in text: return "legacy"\n', '            if "حالهالعداد" in text or "حالةالعداد" in text or "status" in text or "operationalstatus" in text: return "status"\n            if "قراء" in text or "value" in text or "meter" in text: return "legacy"\n')
          router.write_text(text, encoding='utf-8')

          services = Path('app/modules/meter_readings/services.py'); text = services.read_text(encoding='utf-8')
          old = '"equipment_status": normalize_equipment_status(row.get("equipment_status", "available")),'
          new = '"equipment_status": normalize_equipment_status(row.get("equipment_status")) if row.get("equipment_status") not in (None, "") else str(equipment.operational_status or "available"),'
          if old not in text: raise SystemExit('expected equipment status line not found')
          services.write_text(text.replace(old, new), encoding='utf-8')

          tpl = Path('app/modules/meter_readings/templates/meter_readings.html'); text = tpl.read_text(encoding='utf-8')
          text = text.replace('<p>اختر حالة العتاد للقراءات التي سيتم لصقها.</p>', '<p>حالة العداد تكون لكل عتاد داخل بيانات الإدخال، وليست حالة عامة للعملية.</p>')
          text = text.replace('<div class="form-field" style="margin-bottom:10px"><label>حالة العتاد</label><select id="pasteEquipmentStatus"><option value="available">يعمل</option><option value="unavailable">لا يعمل</option></select></div>', '')
          text = text.replace('رقم التسجيل | التاريخ | الكيلومترات | الساعات | الملاحظات', 'رقم التسجيل | التاريخ | الكيلومترات | الساعات | الملاحظات | حالة العداد')
          text = text.replace('<span>سيتم مطابقة رقم التسجيل ثم أخذ القيمة من العمود الموافق لنوع عداد العتاد.</span>', '<span>سيتم مطابقة رقم التسجيل ثم أخذ القيمة من العمود الموافق لنوع العداد، وحالة العداد تُقرأ من عمود كل عتاد إن وُجد.</span>')
          text = text.replace('<div class="form-field" style="margin-bottom:10px"><label>حالة العتاد للملف</label><select id="excelEquipmentStatus"><option value="available">يعمل</option><option value="unavailable">لا يعمل</option></select></div>', '')
          text = text.replace('const status=document.getElementById(\'pasteEquipmentStatus\').value;', '')
          text = text.replace('const payload=rows.map(c=>({registration:c[0]||\'\',reading_date:parseDateClient(c[1]||\'\'),km_value:c[2]||null,hours_value:c[3]||null,notes:c.slice(4).join(\' \')||\'\',equipment_status:status}));', 'const payload=rows.map(c=>({registration:c[0]||\'\',reading_date:parseDateClient(c[1]||\'\'),km_value:c[2]||null,hours_value:c[3]||null,notes:c[4]||\'\',equipment_status:c[5]||null}));')
          text = text.replace("f.append('equipment_status',document.getElementById('excelEquipmentStatus').value);", '')
          tpl.write_text(text, encoding='utf-8')
          PY

      - name: Add regression test
        run: |
          cat > /tmp/test_excel_reader.py <<'PY'
          from io import BytesIO
          from zipfile import ZipFile, ZIP_DEFLATED
          from openpyxl import Workbook
          from app.modules.meter_readings.excel_reader import load_meter_workbook
          wb = Workbook(); ws = wb.active
          ws.append(["رقم التسجيل", "التاريخ", "الكيلومترات", "حالة العداد"])
          ws.append(["356", "11/08/2026", 500, "لا يعمل"])
          buf = BytesIO(); wb.save(buf); buf.seek(0)
          with ZipFile(buf, 'r') as zin:
              out = BytesIO()
              with ZipFile(out, 'w', ZIP_DEFLATED) as zout:
                  for item in zin.infolist():
                      if item.filename != 'xl/styles.xml': zout.writestr(item, zin.read(item.filename))
          out.seek(0); book = load_meter_workbook(out); rows = list(book.active.iter_rows(values_only=True))
          assert rows[0][0] == "رقم التسجيل" and rows[1][0] == "356" and rows[1][2] == 500 and rows[1][3] == "لا يعمل"
          print('OK: malformed/missing stylesheet fallback parsed XLSX rows')
          PY
          PYTHONPATH=. python /tmp/test_excel_reader.py
          PYTHONPATH=. python -m compileall -q app

      - name: Commit repair and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-meter-import.yml
          git add app/modules/meter_readings/router.py app/modules/meter_readings/services.py app/modules/meter_readings/templates/meter_readings.html app/modules/meter_readings/excel_reader.py
          git commit -m "fix: robust Excel import and per-equipment meter status"
          git push origin HEAD:main
